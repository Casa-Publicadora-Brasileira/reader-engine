name: Publish KMP libraries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 0.3.2) when not tagging"
        required: false
        default: "0.3.2"

concurrency:
  group: publish-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  android-jvm:
    name: Publish Android AAR, JVM JAR & Maven Repository
    runs-on: ubuntu-latest
    env:
      SONATYPE_TOKEN_USER: ${{ secrets.SONATYPE_TOKEN_USER }}
      SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GHE_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests, assemble & generate public Maven layout
        run: |
          ./gradlew :reader-core:jvmTest :reader-core:assembleRelease :reader-core:jvmJar \
            :reader-core:publishAndroidReleasePublicationToPublicMavenRepository \
            :reader-core:publishJvmPublicationToPublicMavenRepository \
            :reader-core:publishKotlinMultiplatformPublicationToPublicMavenRepository \
            --no-daemon

      - name: Upload Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: reader-core-aar
          path: reader-core/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Upload Public Maven Repository
        uses: actions/upload-artifact@v4
        with:
          name: reader-core-public-maven
          path: public-maven/
          if-no-files-found: error

      - name: Attach AAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: reader-core/build/outputs/aar/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GHE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish Public Maven to mvn-repo branch
        env:
          GITHUB_TOKEN: ${{ secrets.GHE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          WORKTREE_DIR="$(mktemp -d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin mvn-repo >/dev/null 2>&1; then
            git fetch origin mvn-repo
            git worktree add "$WORKTREE_DIR" origin/mvn-repo
            git -C "$WORKTREE_DIR" checkout -B mvn-repo
          else
            git worktree add --detach "$WORKTREE_DIR"
            git -C "$WORKTREE_DIR" checkout --orphan mvn-repo
            git -C "$WORKTREE_DIR" rm -rf . >/dev/null 2>&1 || true
          fi
          cp -R public-maven/. "$WORKTREE_DIR/"
          git -C "$WORKTREE_DIR" add -A
          if ! git -C "$WORKTREE_DIR" diff --cached --quiet; then
            git -C "$WORKTREE_DIR" commit -m "chore(maven): publish reader-core ${VERSION:-${GITHUB_REF_NAME#v}}"
            git -C "$WORKTREE_DIR" push origin HEAD:refs/heads/mvn-repo
          fi
          git worktree remove --force "$WORKTREE_DIR" || true

      - name: Publish to Sonatype Maven Central
        if: env.SONATYPE_TOKEN_USER != '' && env.SONATYPE_TOKEN_PASSWORD != ''
        run: |
          ./gradlew \
            :reader-core:publishAndroidReleasePublicationToSonatypeCentralRepository \
            :reader-core:publishJvmPublicationToSonatypeCentralRepository \
            :reader-core:publishKotlinMultiplatformPublicationToSonatypeCentralRepository \
            --no-daemon
        env:
          SONATYPE_TOKEN_USER: ${{ secrets.SONATYPE_TOKEN_USER }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Publish to GitHub Packages Enterprise
        run: |
          ./gradlew \
            :reader-core:publishAndroidReleasePublicationToGitHubPackagesRepository \
            :reader-core:publishJvmPublicationToGitHubPackagesRepository \
            :reader-core:publishKotlinMultiplatformPublicationToGitHubPackagesRepository \
            --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GHE_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PACKAGES_URL: ${{ vars.GHE_PACKAGES_URL || vars.GITHUB_PACKAGES_URL || '' }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  ios-xcframework:
    name: Build & Publish iOS XCFramework
    runs-on: macos-14
    env:
      VERSION: ${{ inputs.version || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble ReaderCore Release XCFramework
        run: ./gradlew :reader-core:assembleReaderCoreReleaseXCFramework --no-daemon

      - name: Package XCFramework archive
        run: |
          cd reader-core/build/XCFrameworks/release
          zip -r -y ReaderCore.xcframework.zip ReaderCore.xcframework

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-core-xcframework
          path: reader-core/build/XCFrameworks/release/ReaderCore.xcframework.zip
          if-no-files-found: error

      - name: Attach XCFramework to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: reader-core/build/XCFrameworks/release/ReaderCore.xcframework.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GHE_TOKEN || secrets.GITHUB_TOKEN }}
