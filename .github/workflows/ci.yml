name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run KMP unit tests & build Android sample
        run: ./gradlew :reader-core:jvmTest :reader-core:assembleRelease :sample-android:assembleDebug --no-daemon

  ios:
    name: Build XCFramework & iOS Sample (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble ReaderCore Debug XCFramework
        run: ./gradlew :reader-core:assembleReaderCoreDebugXCFramework --no-daemon

      - name: Build iOS Sample App (Simulator)
        run: |
          xcodebuild \
            -project sample-ios/ReaderEngineSample.xcodeproj \
            -scheme ReaderEngineSample \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
