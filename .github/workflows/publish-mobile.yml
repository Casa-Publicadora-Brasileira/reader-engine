name: Publish KMP libraries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 0.2.0) when not tagging"
        required: false
        default: "0.2.0-SNAPSHOT"

concurrency:
  group: publish-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  android-jvm:
    name: Publish Android AAR & JVM JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests & assemble artifacts
        run: ./gradlew :reader-core:jvmTest :reader-core:assembleRelease :reader-core:jvmJar --no-daemon

      - name: Upload Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: reader-core-aar
          path: reader-core/build/outputs/aar/*.aar
          if-no-files-found: error
