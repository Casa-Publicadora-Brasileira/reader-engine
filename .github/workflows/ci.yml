name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run KMP unit tests & build Android modules
        run: ./gradlew :reader-core:jvmTest :reader-core:assembleRelease :reader-ui-android:testDebugUnitTest :reader-ui-android:assembleRelease :sample-android:assembleDebug --no-daemon

  ios:
    name: Build XCFramework, ReaderEngineUI & iOS Sample (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble ReaderCore Debug XCFramework
        run: ./gradlew :reader-core:assembleReaderCoreDebugXCFramework --no-daemon

      - name: Typecheck ReaderEngineUI Swift package sources
        run: |
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          FRAMEWORK_DIR="$(find reader-core/build/XCFrameworks/debug/ReaderCore.xcframework -maxdepth 1 -type d -name 'ios-*simulator' | head -n 1)"
          swiftc -typecheck \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0-simulator \
            -F "$FRAMEWORK_DIR" \
            reader-ui-ios/Sources/ReaderEngineUI/*.swift

      - name: Build iOS Sample App (Simulator)
        run: |
          xcodebuild \
            -project sample-ios/ReaderEngineSample.xcodeproj \
            -scheme ReaderEngineSample \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
